# Used by BOTH services since v1.0 (knowledge-service calls the embeddings API).
# agent-service 2.0 also needs documind-postgres: see k8s/35-postgres/secret.example.yaml
# Easiest: scripts/create-secrets.sh creates both.
# EXAMPLE ONLY - do not put a real key in a file you might commit.
# Preferred:  kubectl create secret generic documind-llm -n documind \
#               --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: documind-llm
  namespace: documind
type: Opaque
stringData:
  OPENROUTER_API_KEY: "sk-or-v1-REPLACE_ME"
