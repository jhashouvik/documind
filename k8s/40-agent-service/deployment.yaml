apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: documind
  labels: {app.kubernetes.io/name: agent-service, app.kubernetes.io/part-of: documind, track: stable}
spec:
  replicas: 2                            # 2 from the start: sessions live in Redis, so any pod can answer
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-service, track: stable}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/part-of: documind
        app.kubernetes.io/version: "1.0.0"
        track: stable
    spec:
      automountServiceAccountToken: false
      # longer than the slowest answer: in-flight streams finish during a rollout
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: agent-service}
      containers:
        - name: agent-service
          image: documind/agent-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8002}
          envFrom:
            - configMapRef: {name: agent-config}
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: {name: documind-llm, key: OPENROUTER_API_KEY}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true      # the image cannot be modified at runtime...
          volumeMounts:
            - {name: tmp, mountPath: /tmp}    # ...except /tmp, where uploads are spooled
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
