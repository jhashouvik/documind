# CPU covers parsing/chunking; embeddings are remote (OpenRouter) since v1.0.
# Needs metrics-server (installed in the Kubernetes guide, Step 6).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: knowledge-service
  namespace: documind
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: knowledge-service}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 1, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 180
