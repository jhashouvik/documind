# Qdrant = the vector database. A StatefulSet (not a Deployment) because it
# owns data: the pod keeps a stable name (qdrant-0) and its own
# PersistentVolumeClaim, which survives pod deletion and rescheduling.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: documind
  labels: {app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: documind}
spec:
  serviceName: qdrant-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  template:
    metadata:
      labels: {app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: documind}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
          env:
            - {name: QDRANT__TELEMETRY_DISABLED, value: "true"}
            - {name: QDRANT__LOG_LEVEL, value: "INFO"}
          volumeMounts:
            - {name: storage, mountPath: /qdrant/storage}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
  # one PVC per pod, created from this template: storage-qdrant-0
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard        # kind's built-in local-path provisioner
        resources:
          requests:
            storage: 2Gi
