# Headless Service (clusterIP: None): gives each StatefulSet pod a stable DNS
# name, e.g. qdrant-0.qdrant-headless.documind.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: documind
  labels: {app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: documind}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
---
# Normal ClusterIP Service that clients use: http://qdrant:6333
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: documind
  labels: {app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: documind}
spec:
  selector: {app.kubernetes.io/name: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
