# Only for a PRIVATE GitHub repo. Do NOT commit a real token - create it with kubectl:
#   read -rsp "GitHub token (repo read): " GH_TOKEN; echo
#   kubectl -n argocd create secret generic documind-repo \
#     --from-literal=type=git \
#     --from-literal=url=https://github.com/YOUR_GITHUB_USER/documind.git \
#     --from-literal=username=YOUR_GITHUB_USER \
#     --from-literal=password="$GH_TOKEN"
#   kubectl -n argocd label secret documind-repo argocd.argoproj.io/secret-type=repository
#   unset GH_TOKEN
# The label is what makes Argo CD treat the Secret as repository credentials.
apiVersion: v1
kind: Secret
metadata:
  name: documind-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/YOUR_GITHUB_USER/documind.git
  username: YOUR_GITHUB_USER
  password: ghp_REPLACE_ME
