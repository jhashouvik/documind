# Argo CD web UI at http://argocd.localtest.me:8080 (through your SSH tunnel).
# argocd-server normally serves HTTPS itself. In this lab we switch it to plain
# HTTP (--insecure) and let ingress-nginx front it; in production you would
# terminate TLS at the Ingress with cert-manager instead:
#   kubectl -n argocd patch configmap argocd-cmd-params-cm --type merge \
#     -p '{"data":{"server.insecure":"true"}}'
#   kubectl -n argocd rollout restart deployment argocd-server
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argocd-server, port: {number: 80}}
