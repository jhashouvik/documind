# Redis holds the rate-limit counters (agent-service 2.0 keeps conversations in
# Postgres). Shared by all agent pods, so "20 requests/minute per IP" holds
# cluster-wide however many replicas run. Deliberately NOT persistent: losing it
# only resets the counters, and the limiter fails open meanwhile - so a plain
# Deployment with no disk is the simplest correct choice here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: documind
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: documind}
spec:
  replicas: 1
  strategy: {type: Recreate}       # never two Redis pods at once
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: documind}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999             # the 'redis' user inside the official image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no",
                 "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          emptyDir: {}
