apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service-canary
  namespace: documind
  labels: {app.kubernetes.io/name: agent-service, app.kubernetes.io/part-of: documind, track: canary}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent-service, track: canary}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/part-of: documind
        app.kubernetes.io/version: "1.1.0"
        track: canary
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent-service
          image: documind/agent-service:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8002}
          envFrom:
            - configMapRef: {name: agent-config-canary}
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: {name: documind-llm, key: OPENROUTER_API_KEY}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
