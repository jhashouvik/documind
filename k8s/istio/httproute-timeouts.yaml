# Timeouts as configuration (Gateway API "GAMMA" route attached to a Service).
# A search that takes longer than 10 s fails fast with 504 at the waypoint,
# instead of holding an agent request open. Uploads keep their long timeout.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowledge-timeouts
spec:
  parentRefs:
    - {group: "", kind: Service, name: knowledge-service, port: 8001}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/search}
      timeouts:
        request: 10s
      backendRefs:
        - {name: knowledge-service, port: 8001}
    - matches:
        - path: {type: PathPrefix, value: /}
      timeouts:
        request: 180s
      backendRefs:
        - {name: knowledge-service, port: 8001}
