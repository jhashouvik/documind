# A waypoint = an Envoy proxy (one small Deployment) that handles Layer 7
# (HTTP) for the services that opt in with the label istio.io/use-waypoint.
# Istio creates the Deployment and Service from this Gateway object.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: knowledge-waypoint
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
