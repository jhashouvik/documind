apiVersion: v1
kind: Namespace
metadata:
  name: documind
  labels:
    app.kubernetes.io/part-of: documind
    # Pod Security Standards (built into Kubernetes):
    #   enforce baseline  -> reject clearly dangerous pods (privileged, hostPath...)
    #   warn/audit restricted -> tell us where we fall short of the strictest level
    # Our two services meet "restricted"; the Qdrant image runs as root, so the
    # namespace enforces "baseline" (see tutorial Part 6).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
