# Fluent Bit = the log SHIPPER (pillar 1, the article's Step 7.2).
# A DaemonSet: exactly one pod per node. Each pod tails
# /var/log/containers/*.log on its node (every container's stdout/stderr, written
# there by containerd), enriches every line with Kubernetes metadata
# (namespace, pod, labels) and pushes it to Loki.
#
#   helm repo add fluent https://fluent.github.io/helm-charts
#   helm upgrade --install fluent-bit fluent/fluent-bit --version 0.58.2 \
#     -n observability -f k8s/observability/fluent-bit-values.yaml
#
# Fluentd vs Fluent Bit: same family (CNCF). Fluentd = Ruby, many plugins, ~100+ MB
# per pod; Fluent Bit = C, ~10-20 MB, the usual DaemonSet choice today.
# On EKS you would change only the [OUTPUT]: cloudwatch_logs instead of loki.
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}

tolerations:                      # also run on the control-plane node (ingress-nginx lives there)
  - operator: Exists
    effect: NoSchedule

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 2
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/*fluent-bit*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Refresh_Interval 10

  filters: |
    # Add namespace/pod/container/labels. Merge_Log: our services log JSON, so
    # its fields (level, logger, message, request_id, trace_id ...) become
    # real fields instead of one long string.
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Labels On
        Annotations Off

  outputs: |
    # Labels = what Loki INDEXES. Keep them few and low-cardinality: namespace,
    # app, container, pod are fine; request ids or trace ids as labels would
    # explode the index (they stay inside the JSON line, searchable with | json).
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.observability.svc.cluster.local
        Port 3100
        Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], app=$kubernetes['labels']['app.kubernetes.io/name']
        Remove_Keys kubernetes,stream,_p
        Line_Format json
        Auto_Kubernetes_Labels Off
        Retry_Limit 5
