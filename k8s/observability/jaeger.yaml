# Jaeger = the TRACE store + UI (pillar 3). Version 2 is itself built on the
# OpenTelemetry Collector and speaks OTLP natively.
# All-in-one + in-memory storage: perfect for a lab, traces are lost when the
# pod restarts. Production: Jaeger with Elasticsearch/OpenSearch/Cassandra, or
# Grafana Tempo on S3, or AWS X-Ray on EKS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: {app.kubernetes.io/name: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          env:
            # the built-in all-in-one config listens on ${JAEGER_LISTEN_HOST:-localhost};
            # "localhost" would make OTLP unreachable from other pods
            - {name: JAEGER_LISTEN_HOST, value: "0.0.0.0"}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels: {app.kubernetes.io/name: jaeger}
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
# Jaeger UI at http://jaeger.localtest.me:8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: jaeger.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: jaeger, port: {name: ui}}
