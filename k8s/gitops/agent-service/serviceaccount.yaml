# Its own identity. Not used to call the Kubernetes API (no token is mounted);
# on Day 14 Istio uses it as the workload identity in mTLS certificates:
#   spiffe://cluster.local/ns/documind/sa/agent-service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-service
  labels: {app.kubernetes.io/name: agent-service, app.kubernetes.io/part-of: documind}
automountServiceAccountToken: false
