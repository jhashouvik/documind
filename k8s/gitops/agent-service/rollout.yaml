# agent-service as an Argo Rollout with a CANARY strategy and nginx traffic
# splitting. A release goes:
#
#   setWeight 20  -> 20 % of requests to the new version (canary Ingress weight 20)
#   pause 2m      -> let real traffic hit it
#   analysis      -> Prometheus: canary 5xx ratio must stay below 5 %
#   setWeight 50  -> pause 2m -> analysis again
#   (end)         -> 100 %: canary becomes the new stable, old pods scale down
#
# Any failed analysis ABORTS: weight back to 0, stable untouched.
# Manual controls:  kubectl argo rollouts promote|abort|retry agent-service -n documind
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: agent-service
  labels: {app.kubernetes.io/name: agent-service, app.kubernetes.io/part-of: documind}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: agent-service}
  strategy:
    canary:
      stableService: agent-service
      canaryService: agent-service-canary
      trafficRouting:
        nginx:
          stableIngress: agent-service
          additionalIngressAnnotations:          # testers can force a version
            canary-by-header: X-Canary           # X-Canary: always | never
      # ephemeral labels: dashboards and alerts can still say track=stable|canary
      stableMetadata:
        labels: {track: stable}
      canaryMetadata:
        labels: {track: canary}
      maxSurge: "25%"
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: agent-error-rate
            args:
              - name: canary-job
                value: agent-service-canary
        - setWeight: 50
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: agent-error-rate
            args:
              - name: canary-job
                value: agent-service-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/part-of: documind
    spec:
      serviceAccountName: agent-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent-service
          image: documind/agent-service:latest     # tag set by `images:` in ../kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8002}
          envFrom:
            - configMapRef: {name: agent-config}    # kustomize rewrites to agent-config-<hash>
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: {name: documind-llm, key: OPENROUTER_API_KEY}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
