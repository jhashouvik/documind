# EXAMPLE ONLY - do not put a real password in a file you might commit.
# Preferred (random password, never written to disk):
#   kubectl create secret generic documind-postgres -n documind \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)"
# Read by BOTH the postgres StatefulSet and agent-service (which builds
# DATABASE_URL from it, see k8s/40-agent-service/deployment.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: documind-postgres
  namespace: documind
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
