# Postgres = the agent's MEMORY (agent-service 2.0):
#   * LangGraph checkpoints: the full graph state after every step, per chat
#     session (thread_id). This is what makes agent-service pods STATELESS:
#     a conversation, or a paused human-in-the-loop action, can continue on
#     ANY pod, after a rollout, a crash or a scale-down.
#   * LangGraph store: long-term memory (facts about a user across sessions).
# The tables are created by agent-service at startup (saver.setup()), no
# migration Job needed.
#
# A StatefulSet (like Qdrant) because it owns data: stable name postgres-0 and
# its own PersistentVolumeClaim (data-postgres-0) that survives pod deletion.
# ONE replica: Postgres replication/failover is a job for an operator
# (CloudNativePG, Zalando) or a managed database (RDS, Cloud SQL) in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: documind
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: documind}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: documind}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60          # let Postgres finish its shutdown checkpoint
      securityContext:
        # the alpine image's "postgres" user is uid/gid 70; running as it from the
        # start (instead of root + gosu) meets the "restricted" Pod Security level
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70                              # make the volume writable for uid 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: documind}
            - {name: POSTGRES_DB, value: documind}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: documind-postgres, key: POSTGRES_PASSWORD}
            # a SUBDIRECTORY of the mount: initdb refuses a non-empty directory, and a
            # fresh volume may already contain "lost+found"
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          args:
            # each agent pod opens at most DB_POOL_SIZE connections:
            #   agent max replicas (KEDA: 6) x DB_POOL_SIZE (5) = 30  << max_connections
            - "-c"
            - "max_connections=100"
            - "-c"
            - "shared_buffers=64MB"
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "documind", "-d", "documind", "-h", "127.0.0.1"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "documind", "-d", "documind", "-h", "127.0.0.1"]}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true         # writable: only the volumes below
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}     # unix socket + lock file
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard               # kind's built-in local-path provisioner
        resources:
          requests:
            storage: 1Gi
