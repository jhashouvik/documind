# CI for DocuMind: test -> build -> scan -> push to GitHub Container Registry.
# Runs on every push and pull request; images are pushed only from main.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  packages: write          # push to ghcr.io
  security-events: write   # upload Trivy results to the Security tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [knowledge-service, agent-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install
        run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # plain manifests (built-in schemas) + CRD-based ones (schemas from the CRDs catalog)
          for d in k8s k8s/60-canary k8s/observability k8s/gitops k8s/70-observability; do
            kubectl kustomize "$d" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done
          # the gitops tree again with the Day 13/14 components switched on
          sed 's#^components: \[\]#components: [../keda, ../istio]#' k8s/gitops/kustomization.yaml > /tmp/k.yaml
          cp /tmp/k.yaml k8s/gitops/kustomization.yaml
          kubectl kustomize k8s/gitops | ./kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

  image:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [knowledge-service, agent-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/documind-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/documind-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/documind-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
